services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ticketchain
      POSTGRES_USER: ticketchain_user
      POSTGRES_PASSWORD: dev_password
    ports:
      # Host 25432 avoids clashing with other local Postgres / sibling projects
      - '25432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketchain_user -d ticketchain']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host 16379 avoids clashing with other local Redis (6379 often taken)
      - '16379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
